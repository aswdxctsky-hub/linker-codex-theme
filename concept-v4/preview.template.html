<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>连接 · V4</title>
<style>
:root{--ink:#263440;--muted:#6c7e8c;--blue:#77aec1;--scale:1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f8fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,textarea:focus-visible{outline:2px solid #6e9eae;outline-offset:4px}button:disabled{cursor:wait;opacity:.45}[hidden]{display:none!important}
#viewport{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--scale));transform-origin:center}#screen{display:block;width:1920px;height:1080px}.hit{position:absolute;left:816px;top:690px;width:288px;height:62px;opacity:0;border:0;cursor:pointer}#dragon-video{display:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.preview-controls{position:fixed;right:22px;bottom:16px;z-index:100;display:flex;flex-direction:column;align-items:flex-end;gap:10px}.menu-toggle{border:1px solid #b9c9d380;background:#ffffff94;backdrop-filter:blur(20px);font-size:12px;border-radius:5px;padding:7px 12px;color:#677e8a}.menu{padding:8px;width:180px;background:#fffffff0;border:1px solid #c5d2db;border-radius:8px;box-shadow:0 12px 30px #334c6515;display:grid;gap:2px;backdrop-filter:blur(16px)}.menu button,.menu label{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:10px;font-size:13px;text-align:left;border-radius:4px}.menu button:hover,.menu label:hover{background:#eaf1f5}.menu input{accent-color:#536f7d}.menu-note{margin:3px 10px 6px;font-size:11px;color:#81939d;line-height:1.5}.export-status{font-size:12px;max-width:300px;text-align:right;color:#657c88;background:#ffffffd0;border-radius:4px;padding:4px 9px}.export-status:empty{display:none}
.chat{position:fixed;inset:0;z-index:3;display:grid;grid-template-columns:250px minmax(0,1fr);background:var(--chat-bg) center/cover no-repeat}.sidebar{display:flex;flex-direction:column;padding:29px 17px 19px;background:rgba(245,248,251,.68);backdrop-filter:blur(18px);border-right:1px solid #d4dfe66b}.side-brand{border:0;background:none;width:44px;height:44px;padding:6px;margin:0 0 28px 7px}.side-brand img{width:32px;height:32px}.nav-item{display:flex;align-items:center;gap:13px;width:100%;padding:13px 15px;border:0;border-radius:8px;background:none;text-align:left;font-size:14px}.nav-item:hover{background:#dfe8ef75}.nav-item svg{width:18px;height:18px;stroke:#506570;fill:none;stroke-width:1.5}.side-section{margin:37px 15px 14px;font-size:12px;color:#8a9ba5}.chat-entry{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile{margin-top:auto;display:flex;gap:11px;align-items:center;padding:11px 12px;font-size:13px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e2eaf0;border:1px solid #c5d5e0;font-size:13px}.workspace{position:relative;display:flex;flex-direction:column;min-width:0}.chat-top{display:flex;align-items:center;padding:23px 33px;gap:11px;font-size:17px;color:#4b5e6b}.chat-top svg{width:14px;stroke:#81919b;fill:none;stroke-width:1.4}.top-settings{margin-left:auto;border:0;background:none;padding:7px;font-size:20px;color:#8195a1}.chat-center{width:min(740px,calc(100% - 88px));margin:auto;transform:translateY(-25px)}.welcome{text-align:center;margin:0 0 35px;font-size:30px;font-weight:400;letter-spacing:.03em}.composer{border:1px solid #b8ccd8a0;background:rgba(255,255,255,.72);border-radius:22px;padding:19px 21px 15px;box-shadow:0 7px 26px #708fa00d;backdrop-filter:blur(18px)}.composer textarea{display:block;width:100%;min-height:58px;max-height:190px;resize:none;overflow:auto;border:0;background:none;color:#304653;line-height:1.65;font-size:15px;outline:none}.composer textarea::placeholder{color:#899ba7}.composer-bottom{display:flex;justify-content:space-between;align-items:center}.compose-plus{font-size:25px;line-height:28px;border:0;background:none;color:#718793;padding:0 4px}.compose-actions{display:flex;align-items:center;gap:14px}.compose-hint{font-size:12px;color:#8b9da7}.send{width:35px;height:35px;background:#334d5d;color:#fff;border-radius:50%;border:0;display:grid;place-items:center}.send svg{width:19px;stroke:currentColor;fill:none;stroke-width:1.8}.draft-notice{min-height:18px;font-size:12px;text-align:center;color:#78909f;margin:13px 0 0}.conversation{display:flex;flex-direction:column;gap:22px;padding-bottom:30px}.user-draft{align-self:flex-end;max-width:85%;background:#eaf1f6b0;border:1px solid #cedde575;border-radius:15px;padding:12px 18px;font-size:15px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.chat-foot{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;color:#8ba0ad;white-space:nowrap}.side-search{margin:12px 10px 3px;padding:8px 10px;border:1px solid #c8d5dd;background:#ffffffb3;border-radius:5px;min-width:0;width:calc(100% - 20px);font-size:13px}.fatal{position:fixed;inset:0;z-index:200;background:#f5f8fb;display:grid;place-items:center;color:#4c6270;padding:40px;text-align:center}
@media(max-width:850px){.chat{grid-template-columns:190px 1fr}.sidebar{padding:20px 8px}.chat-center{width:calc(100% - 48px)}.welcome{font-size:25px}.chat-top{padding:22px}.compose-hint{display:none}}@media(max-width:600px){.chat{grid-template-columns:1fr}.sidebar{display:none}.chat-center{width:calc(100% - 32px);transform:translateY(-20px)}.welcome{font-size:24px}.chat-foot{bottom:58px}.preview-controls{right:12px;bottom:12px}.chat-top{padding:20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.hit{left:784px;top:752px;width:352px;height:82px}
.language-controls{position:fixed;right:27px;top:23px;z-index:80;display:flex;align-items:center;gap:12px;transition:opacity .4s}.voice-label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:#6c8492}.voice-label small{font-size:9px;color:#8ba0ac}.language-switch{display:flex;border:1px solid #b9c9d369;border-radius:5px;padding:3px;background:#ffffff7a;backdrop-filter:blur(12px)}.language-switch button{border:0;background:none;min-width:35px;height:29px;border-radius:3px;font-size:11px;color:#8196a3}.language-switch button[aria-pressed=true]{color:#334e5e;background:#e0edf3a1;box-shadow:inset 0 -1px #83aebb}.language-note{position:absolute;right:0;top:43px;white-space:nowrap;font-size:10px;color:#67808e}.character-visible .language-controls{opacity:0;pointer-events:none}.dual{display:flex;flex-direction:column;gap:3px}.dual small,.nav-item small{display:block;font-size:10px;font-weight:400;line-height:1.3;color:#7a919e}.nav-item{padding-top:11px;padding-bottom:11px}.welcome small{display:block;font-size:15px;letter-spacing:0;color:#7a919e;margin-top:11px}.side-section small{display:block;font-size:10px;margin-top:3px}.chat-entry small{font-size:10px;color:#8ba0ad}.composer-sub{display:block;color:#91a2ac;font-size:11px;margin:-3px 0 13px 1px}.chat-foot{text-align:center;line-height:1.6}.chat-foot small{display:block;font-size:9px;color:#98aab4}.menu button small,.menu label small{display:block;font-size:10px;color:#8197a4;margin-top:3px}.menu{width:195px}.menu-toggle small{font-size:10px;color:#8499a5;margin-left:6px}.draft-notice small{display:block;margin-top:4px;font-size:10px}.language-controls:focus-within{opacity:1;pointer-events:auto}@media(max-width:600px){.language-controls{top:15px;right:16px}.welcome small{font-size:13px}.language-note{font-size:9px}.chat-foot{white-space:normal;width:90%}}
</style>
</head>
<body>
<div id="viewport"><canvas id="screen" width="1920" height="1080" aria-label="ChatGPT 启动预览"></canvas><button id="action" class="hit" type="button" aria-label="连接"></button></div>
<video id="dragon-video" preload="auto" playsinline muted></video>
<div class="language-controls" aria-label="音声语言 / Voice language"><span class="voice-label">音声<small>Voice</small></span><div class="language-switch" role="group" aria-label="选择音声语言"><button id="lang-zh" aria-label="中文音声" aria-pressed="true">中</button><button id="lang-en" aria-label="English voice" aria-pressed="false">EN</button></div><span id="language-note" class="language-note" role="status"></span></div>
<section id="chat" class="chat" hidden aria-label="主题对话预览">
 <aside class="sidebar">
  <button class="side-brand" id="brand-home" aria-label="返回新聊天"><img id="side-logo" alt="ChatGPT"></button>
  <button class="nav-item" id="new-chat"><svg viewBox="0 0 24 24"><path d="M13 5H5v14h14v-8M12 12l8-8M16 4h4v4"/></svg><span class="dual">新聊天<small>New chat</small></span></button>
  <button class="nav-item" id="search-chat"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><span class="dual">搜索聊天<small>Search chats</small></span></button>
  <input id="search-field" class="side-search" placeholder="搜索本页草稿" hidden aria-label="搜索本页草稿">
  <button class="nav-item" id="projects"><svg viewBox="0 0 24 24"><path d="M3 7V5h7l2 2h9v13H3z"/></svg><span class="dual">项目<small>Projects</small></span></button>
  <div class="side-section">聊天<small>Chats</small></div><button class="nav-item chat-entry" id="draft-entry"><span class="dual">新的聊天<small>New conversation</small></span></button>
  <div class="profile"><div class="avatar">S</div><span>Skyler</span></div>
 </aside>
 <main class="workspace">
  <div class="chat-top">ChatGPT<svg viewBox="0 0 16 16"><path d="m3 6 5 5 5-5"/></svg><button class="top-settings" id="preview-settings" aria-label="预览设置">⋯</button></div>
  <div class="chat-center"><h1 class="welcome" id="welcome">有什么新想法？<small>What's on your mind?</small></h1><div class="conversation" id="conversation"></div>
   <form class="composer" id="composer"><textarea id="message" aria-label="消息输入框" placeholder="想到什么，就从这里开始。" rows="2"></textarea><span class="composer-sub" id="composer-sub">Start with whatever is on your mind.</span><div class="composer-bottom"><button class="compose-plus" type="button" id="attach" aria-label="添加附件">＋</button><div class="compose-actions"><span class="compose-hint dual">Shift + Enter 换行<small>New line</small></span><button class="send" type="submit" aria-label="发送"><svg viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></svg></button></div></div></form>
   <p class="draft-notice" id="draft-notice" role="status"></p>
  </div><div class="chat-foot">ChatGPT 也可能会犯错。请核查重要信息。<small>ChatGPT can make mistakes. Check important information.</small></div>
 </main>
</section>
<div class="preview-controls"><span class="export-status" id="export-status" role="status"></span><div class="menu" id="preview-menu" hidden><label><input type="checkbox" id="auto" checked><span>自动播放<small>Autoplay</small></span></label><button id="sound" aria-pressed="true"><span>声音：开<small>Sound on</small></span></button><button id="replay"><span>重新播放<small>Replay</small></span></button><button id="skip"><span>跳过开场<small>Skip intro</small></span></button><button id="save"><span>保存画面<small>Save frame</small></span></button><button id="record"><span>导出完整样片<small>Export video</small></span></button><p class="menu-note">独立预览 · Esc 跳过<br>Local preview · Esc to skip</p></div><button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="preview-menu">预览<small>Preview</small></button></div>
<p class="sr" id="status" aria-live="polite">等待连接</p><div id="fatal" class="fatal" hidden></div>
<script>/*__MEDIA__*/</script><script>/*__APP__*/</script>
</body></html>
